<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio — Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <span class="nav-separator">|</span>
                <a href="art.html" class="nav-link active">Art</a>
                <span class="nav-separator">|</span>
                <a href="tierlist.html" class="nav-link">Tierlist</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="gallery-header" id="galleryHeader">
            <h1 id="galleryTitle">Awesome arts</h1>
            <p id="gallerySubtitle">you can click on them!</p>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- contenido dinámico -->
        </div>
    </main>

    <!-- Modal estilo WhatsApp -->
    <div id="imageModal" class="modal">
        <span class="modal-close">&times;</span>
        <div class="modal-prev">‹</div>   <!-- izquierda = anterior -->
        <div class="modal-next">›</div>   <!-- derecha = siguiente -->
        
        <div class="modal-image-container">
            <img id="modalMainImage" class="modal-main-image" src="" alt="obra">
        </div>
        
        <div id="modalThumbnails" class="modal-thumbnails">
            <!-- miniaturas dinámicas -->
        </div>
    </div>

    <script src="js/art.js"></script>
